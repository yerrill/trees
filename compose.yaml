name: tree_service

services:
  webapp:
    build: ./webapp
    restart: unless-stopped
    depends_on:
      - db
    volumes:
      - webapp_data:/var/www/html/data:rw
    networks:
      - isolated
      - wide

  db:
    image: mysql:9
    restart: unless-stopped
    volumes:
      - db_data:/var/lib/mysql:rw
    environment:
      - MYSQL_DATABASE=prod
      - MYSQL_RANDOM_ROOT_PASSWORD=yes
    networks:
      - isolated
  
  proxy:
    image: nginx:stable
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./htpasswd:/etc/nginx/.htpasswd:ro
    networks:
      - wide
    ports:
      - 80:80


volumes:
  webapp_data: {}
  db_data: {}

networks:
  wide: {}
  isolated:
    internal: true